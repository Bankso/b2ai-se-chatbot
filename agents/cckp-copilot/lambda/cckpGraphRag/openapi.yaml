openapi: 3.0.0
info:
  title: CCKP Graph RAG Function API
  version: 1.0.0
  description: >
    This schema describes the four agent-facing functions for CCKP knowledge
    graph RAG. A Lambda adapter maps these operations to Bedrock action-group
    style function calls via apiPath or function name.

    The Lambda submits each query to SageBrain's async job-queue endpoint
    (POST -> job_id -> poll GET until status=="complete"), resolves the
    current CCKP named graph (SageBrain is a shared, append-only, multi-
    portal triple store — every query is scoped to the latest
    urn:sagebrain:cckp:{date} snapshot), and returns parsed SPARQL 1.1 Query
    Results JSON as {headers, rows, count} rather than raw TSV.
tags:
  - name: sparql
    description: SPARQL and schema helper operations for the CCKP knowledge graph
paths:
  /sparql-query:
    post:
      tags:
        - sparql
      operationId: sparqlQuery
      summary: Execute a SPARQL query, scoped to the current CCKP graph
      description: >
        Runs a SPARQL query against the configured CCKP SPARQL endpoint and
        returns parsed bindings. The implementation prepends the default
        CCKP ontology prefixes and scopes the query to the current CCKP
        named graph automatically — the query text should not include its
        own GRAPH clause or graph URI. Always type-anchor to a cckp: class
        (e.g. `?x a cckp:Dataset`) since this is a shared triple store
        across multiple Sage-affiliated portals. A default LIMIT is applied
        server-side if the query doesn't specify one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SparqlQueryRequest"
            examples:
              tripleCount:
                value:
                  query: "SELECT (COUNT(*) AS ?n) WHERE { ?s a cckp:Dataset }"
      responses:
        "200":
          description: Parsed query result or application-level error payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResultResponse"
  /schema:
    post:
      tags:
        - sparql
      operationId: getSchema
      summary: List CCKP ontology classes and properties
      description: >
        Returns ontology terms (classes, object properties, datatype
        properties) scoped to the CCKP namespace
        (https://w3id.org/mc2-center/cckp-portal/) and the current CCKP
        named graph — not every class/property on the shared triple store.
      responses:
        "200":
          description: Parsed schema result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResultResponse"
  /shape:
    post:
      tags:
        - sparql
      operationId: getShape
      summary: Retrieve the SHACL shape for one CCKP class
      description: >
        Returns the SHACL node shape and property constraints for the
        requested class, scoped to the current CCKP named graph. KNOWN
        LIMITATION: as of this writing, only Dataset and Grant have a real
        sh:targetClass-based shape upstream — Publication/Tool/
        EducationalResource will likely return an empty result until that
        upstream schema gap is closed (tracked in a separate data-models
        repo plan). The class name may be passed either as a local name
        like Dataset or as a prefixed value like cckp:Dataset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetShapeRequest"
            examples:
              dataset:
                value:
                  className: Dataset
      responses:
        "200":
          description: Requested shape or application-level error payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetShapeResponse"
  /count-by-type:
    post:
      tags:
        - sparql
      operationId: countByType
      summary: CCKP inventory — count instances of each of the 5 CCKP classes
      description: >
        Returns per-class instance counts for Dataset, Publication, Tool,
        Grant, and EducationalResource, scoped to the current CCKP named
        graph. This is an explicit per-class enumeration, not an unscoped
        `?s a ?type` count — the shared triple store also holds NF-OSI,
        ALS Knowledge Portal, and other portals' classes, which an unscoped
        count would silently include.
      responses:
        "200":
          description: Parsed count result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResultResponse"
components:
  schemas:
    SparqlQueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: >
            SPARQL query text (a full SELECT or ASK query, not just a
            WHERE-clause body; CONSTRUCT/DESCRIBE are rejected). The Lambda
            implementation prepends the default CCKP ontology prefixes and
            scopes the query to the current CCKP named graph automatically —
            GRAPH, FROM, and SERVICE are rejected, so do not include a graph
            clause or graph URI in this text. A SELECT's outer LIMIT is
            capped at 200 (added if absent).
      additionalProperties: false
    GetShapeRequest:
      type: object
      required:
        - className
      properties:
        className:
          type: string
          description: >
            Class local name such as Dataset or Grant, or a prefixed name
            like cckp:Dataset.
      additionalProperties: false
    QueryResultResponse:
      type: object
      properties:
        headers:
          type: array
          items:
            type: string
          description: SPARQL result variable names, in projection order.
        rows:
          type: array
          items:
            type: object
          description: One object per result binding, keyed by variable name.
        count:
          type: integer
          description: Number of rows returned.
        boolean:
          type: boolean
          description: ASK queries only — the query's true/false answer (no headers/rows).
        error:
          type: string
          description: Application-level error text returned by the function.
      additionalProperties: false
    GetShapeResponse:
      type: object
      properties:
        className:
          type: string
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
        count:
          type: integer
        error:
          type: string
      additionalProperties: false

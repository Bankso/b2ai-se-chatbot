openapi: 3.0.0
info:
  title: B2AI Standards Explorer SQL Function API
  version: 1.0.0
  description: >
    This schema describes the agent-facing functions for querying the
    Bridge2AI Standards Explorer's curated Synapse denormalized tables
    directly via SQL (standards, datasets, organizations, topics,
    substrates, manifest, d4d), plus a D4D (Datasheets for Datasets)
    exploration sub-routine backed by a pinned rendering of the D4D source
    YAML (not the d4d table's raw HTML). A Lambda adapter maps these
    operations to Bedrock action-group style function calls via apiPath or
    function name.
tags:
  - name: sql
    description: SQL query, introspection, and portal URL operations over the B2AI tables
  - name: d4d
    description: >
      D4D (Datasheets for Datasets) exploration for the 4 Bridge2AI Grand
      Challenge organizations, backed by a pinned rendering of the D4D
      source YAML
paths:
  /sql-query:
    post:
      tags:
        - sql
      operationId: sqlQuery
      summary: Execute a SQL query against one B2AI table
      description: >
        Runs a SQL query against one of the B2AI Standards Explorer's
        Synapse denormalized tables (standards, datasets, organizations,
        topics, substrates, manifest, d4d) and returns matching
        rows plus the total match count. The literal `{table}` in the sql
        string is replaced with the resolved (pinned) synId; the SQL may not reference any other table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlQueryRequest"
            examples:
              standardsByCategory:
                value:
                  table: standards
                  sql: SELECT * FROM {table} WHERE "category" = 'Ontology or Vocabulary'
                  limit: 25
      responses:
        "200":
          description: Query result rows or application-level error payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResultResponse"
  /portal-url:
    post:
      tags:
        - sql
      operationId: buildPortalUrl
      summary: Build a working Bridge2AI Standards Explorer portal path
      description: >
        Returns a ready-to-use relative portal path for a Standard,
        Organization, or DataTopic Detail Page (given its `id`), or for the
        Standards search tab (optionally with a free-text `searchTerm`
        and/or `facets`). There is no confirmed Collection-page route for
        datasets, substrates, or manifest. RESOLVED search semantics: a
        multi-word `searchTerm` is OR'd/unioned across words, never ANDed
        (more words only ever broadens results) -- to require several
        concepts at once, use one precise `searchTerm` plus `facets` (or
        several facets on different columns), since facets AND across
        columns, OR within one column's values, and a term ANDs against the
        combined facets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildPortalUrlRequest"
            examples:
              standardDetail:
                value:
                  resourceType: standards
                  id: "B2AI_STANDARD:1"
              organizationDetail:
                value:
                  resourceType: organizations
                  id: "B2AI_ORG:1"
              topicDetail:
                value:
                  resourceType: topics
                  id: "B2AI_TOPIC:1"
              search:
                value:
                  resourceType: search
                  searchTerm: FHIR
              searchWithFacets:
                value:
                  resourceType: search
                  facets:
                    - columnName: topic
                      values: ["Image"]
                    - columnName: category
                      values: ["Ontology or Vocabulary"]
              searchTermAndFacets:
                value:
                  resourceType: search
                  searchTerm: segmentation
                  facets:
                    - columnName: topic
                      values: ["Image"]
      responses:
        "200":
          description: The ready-to-use portal path, or an application-level error payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildPortalUrlResponse"
  /columns:
    post:
      tags:
        - sql
      operationId: getColumns
      summary: List the exact column names of one B2AI table
      description: >
        Returns the deployed column names for one table. Deployed names can
        differ slightly from the data-model labels, so call this before
        writing a SQL query against an unfamiliar table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetColumnsRequest"
            examples:
              standards:
                value:
                  table: standards
      responses:
        "200":
          description: Requested column list or application-level error payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetColumnsResponse"
  /count-by-type:
    post:
      tags:
        - sql
      operationId: countByType
      summary: Count rows in each of the 7 B2AI tables
      description: >
        Returns a quick portal inventory: the row count of each of the
        standards, datasets, organizations, topics, substrates, manifest,
        and d4d tables.
      responses:
        "200":
          description: Per-table row counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountByTypeResponse"
  /d4d-list:
    post:
      tags:
        - d4d
      operationId: listD4Ds
      summary: List the Grand Challenge orgs that have a D4D
      description: >
        Returns the 4 Bridge2AI Grand Challenge organizations that have a
        D4D (Datasheet for Dataset): orgId, display name, the D4D document's
        own title, and a link to the org's Detail Page. Also returns
        `source`, identifying the pinned D4D source YAML this data was
        rendered from.
      responses:
        "200":
          description: The D4D-bearing Grand Challenge orgs, or an application-level error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListD4DsResponse"
  /d4d:
    post:
      tags:
        - d4d
      operationId: getD4D
      summary: Get a Grand Challenge's D4D outline, one section's text, or one field's text
      description: >
        Without `section`/`field`: returns an outline of the D4D (title,
        `source`, and each section's id/heading/description/size plus its
        fields' id/label/size/portalSection -- a section is a group of
        fields per the pinned D4D source schema, not the portal page's own
        grouping; see `portalSection` when a user refers to a portal page
        section by name). With `section`: returns that section's fields
        rendered as text, paged under a ~15,000-character budget via
        `offset`/`nextOffset`. With `field`: returns that one field's text
        (also paged) plus its metadata (label, description, schemaSection,
        portalSection, inSchema). Every form also returns `orgName`/`orgLink`
        (best-effort -- see `orgName` below) so a response can always link
        back to the org's Detail Page. `section` and `field` may not both be
        given -- use `field` for a specific question about one thing, `section`
        to browse a whole group, and `compareD4D` (not this) for the same
        field across all 4 Grand Challenges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetD4DRequest"
            examples:
              outline:
                value:
                  orgId: "B2AI_ORG:114"
              section:
                value:
                  orgId: "B2AI_ORG:114"
                  section: motivation
              field:
                value:
                  orgId: "B2AI_ORG:114"
                  field: distribution_formats
      responses:
        "200":
          description: The D4D outline, section text, or field text, or an application-level error payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetD4DResponse"
  /d4d-compare:
    post:
      tags:
        - d4d
      operationId: compareD4D
      summary: Compare one D4D field across all 4 Grand Challenges
      description: >
        For a cross-GC question about the same field ("how do the challenges'
        datasets differ in X?"), returns that one field's text from each of
        the 4 Grand Challenges (with `present: false` for a GC that has no
        value for it), plus the field's shared label/description/
        schemaSection/portalSection. Each org's text is capped so the whole
        response stays under the same ~15,000-character budget as `getD4D`
        (`truncated` marks a capped org). Use `searchD4D` instead when the
        field isn't known in advance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareD4DRequest"
            examples:
              compare:
                value:
                  field: distribution_formats
      responses:
        "200":
          description: The per-org comparison, or an application-level error payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareD4DResponse"
  /d4d-search:
    post:
      tags:
        - d4d
      operationId: searchD4D
      summary: Keyword search across one or all D4Ds
      description: >
        Case-insensitive keyword search (against each field's rendered text
        and its label) across one Grand Challenge's D4D (if `orgId` is
        given) or all of them, returning at most ~20 hits, each naming its
        field and section. Useful when the field isn't known in advance, or
        for cross-GC questions like "which challenges collected consent
        information?" -- use `compareD4D` instead when the field IS known.
        Across all GCs, the ~20-hit cap is allocated fairly across them
        (not first-come-first-served); check `orgHits`/`truncated` before
        concluding a GC has no coverage, and rerun scoped with `orgId` to see
        a capped GC's remaining matches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchD4DRequest"
            examples:
              allOrgs:
                value:
                  query: consent
              oneOrg:
                value:
                  query: consent
                  orgId: "B2AI_ORG:114"
      responses:
        "200":
          description: Matching snippets, or an application-level error payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchD4DResponse"
components:
  schemas:
    SqlQueryRequest:
      type: object
      required:
        - table
        - sql
      properties:
        table:
          type: string
          description: >
            Table alias (standards, datasets, organizations, topics,
            substrates, manifest, d4d), or the synId of one of those tables (always resolved to its pinned version). For d4d,
            prefer the listD4Ds/getD4D/compareD4D/searchD4D operations, which
            read a pre-rendered, pinned D4D source file, over raw SQL here --
            content_text is the same information as raw HTML, far less
            convenient to work with.
        sql:
          type: string
          description: >
            SQL query text. The literal `{table}` is replaced with the
            resolved pinned synId before execution. Use `{table}` in the FROM clause; a query naming any other synId is rejected.
        limit:
          type: integer
          description: Maximum rows to return (default 25, max 200).
      additionalProperties: false
    BuildPortalUrlRequest:
      type: object
      required:
        - resourceType
      properties:
        resourceType:
          type: string
          description: >
            One of "standards", "organizations", "topics" (a Detail Page
            lookup, requires `id`) or "search" (the Standards search tab,
            optional `searchTerm` and/or `facets`).
        id:
          type: string
          description: >
            Required when resourceType is standards/organizations/topics.
            Must match that table's id prefix (e.g. "B2AI_STANDARD:1",
            "B2AI_ORG:1", "B2AI_TOPIC:1").
        searchTerm:
          type: string
          description: >
            Optional free-text search term, only used when resourceType is
            "search". A multi-word term is OR'd/unioned across words (never
            ANDed) -- it only ever broadens results, so use `facets`, not
            extra words, to require several concepts at once.
        facets:
          type: array
          description: >
            Optional facet filters, only used when resourceType is
            "search". AND across distinct columnName entries, OR within one
            entry's values, and AND against `searchTerm` when both are
            given. Duplicate columnName entries are merged (values unioned).
          items:
            type: object
            required:
              - columnName
              - values
            properties:
              columnName:
                type: string
                description: >
                  One of the facet columns shown on /Search/Standards:
                  applicationNames, category, collections, dataTypes,
                  hasAIApplication, isOpen, mature, registration,
                  relevantOrgNames, topic, topicDescription,
                  usedInBridge2AI. Check exact values first with `sqlQuery`
                  -- never guess one.
              values:
                type: array
                description: Non-empty list of non-empty exact facet values (OR'd together).
                items:
                  type: string
      additionalProperties: false
    BuildPortalUrlResponse:
      type: object
      properties:
        url:
          type: string
          description: >
            Ready-to-use relative portal path (e.g.
            "/Explore/Standard/DetailsPage?id=B2AI_STANDARD:1",
            "/Search/Standards?SEARCH_TERM=FHIR", or, with facets,
            "/Search/Standards?qw0=..." /
            "/Search/Standards?SEARCH_TERM=...&qw0=..."). Relative, not
            absolute — use verbatim as a redirect target, same as any other
            Collection/Detail Page path.
        error:
          type: string
          description: Application-level error text returned by the function.
      additionalProperties: false
    GetColumnsRequest:
      type: object
      required:
        - table
      properties:
        table:
          type: string
          description: >
            Table alias (standards, datasets, organizations, topics,
            substrates, manifest, d4d), or the synId of one of those tables (always resolved to its pinned version). For d4d,
            prefer the listD4Ds/getD4D/compareD4D/searchD4D operations, which
            read a pre-rendered, pinned D4D source file, over raw SQL here --
            content_text is the same information as raw HTML, far less
            convenient to work with.
      additionalProperties: false
    QueryResultResponse:
      type: object
      properties:
        count:
          type: integer
          description: Total matching row count (independent of limit).
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
        error:
          type: string
          description: Application-level error text returned by the function.
      additionalProperties: false
    GetColumnsResponse:
      type: object
      properties:
        table:
          type: string
        columns:
          type: array
          items:
            type: string
        error:
          type: string
      additionalProperties: false
    CountByTypeResponse:
      type: object
      properties:
        counts:
          type: object
          description: Map of table alias to row count.
        errors:
          type: object
          description: Map of table alias to error text, present only on partial failure.
      additionalProperties: false
    D4DSourceInfo:
      type: object
      description: Identifies the pinned D4D source YAML this data was rendered from.
      properties:
        repo:
          type: string
        commit:
          type: string
        synapseTable:
          type: string
    ListD4DsResponse:
      type: object
      properties:
        d4ds:
          type: array
          items:
            type: object
            properties:
              orgId:
                type: string
                description: e.g. "B2AI_ORG:114".
              name:
                type: string
                description: >
                  The Grand Challenge org's display name. Best-effort: the live
                  organizations-table name, falling back to a bundled label
                  if that lookup fails -- never fails the call.
              title:
                type: string
                description: The D4D document's own title.
              link:
                type: string
                description: Relative Organization Detail Page path.
        source:
          $ref: "#/components/schemas/D4DSourceInfo"
        error:
          type: string
      additionalProperties: false
    GetD4DRequest:
      type: object
      required:
        - orgId
      properties:
        orgId:
          type: string
          description: >
            A Grand Challenge org id with a D4D, e.g. "B2AI_ORG:114". Call
            listD4Ds first if unsure which orgs have one.
        section:
          type: string
          description: >
            A section id or heading from a prior outline call, e.g.
            "collection-process" or "Collection Process" (matching is case-
            and spacing-insensitive, with spaces/hyphens/underscores treated
            as equivalent -- same as `field`). Omit, along with `field`, to
            get the outline instead. Not used together with `field`.
        field:
          type: string
          description: >
            A field id or label from a prior outline call, e.g.
            "distribution_formats" or "Distribution Formats" (matching is
            case- and spacing-insensitive). Returns just that one field's
            text plus its metadata. Not used together with `section`.
        offset:
          type: integer
          description: >
            Character offset to resume from, from a prior response's
            `nextOffset`. Only used with `section` or `field`.
      additionalProperties: false
    GetD4DResponse:
      type: object
      properties:
        orgId:
          type: string
        orgName:
          type: string
          description: >
            Present in the outline, section, and field responses. Best-effort:
            the live organizations-table name, falling back to a bundled
            label if that lookup fails -- never fails the call.
        orgLink:
          type: string
          description: Present in the outline, section, and field responses.
        title:
          type: string
          description: Present in the outline response (neither `section` nor `field` given).
        source:
          $ref: "#/components/schemas/D4DSourceInfo"
        sections:
          type: array
          description: Present in the outline response (neither `section` nor `field` given).
          items:
            type: object
            properties:
              id:
                type: string
              heading:
                type: string
              description:
                type: string
              size:
                type: integer
                description: Length in characters of that section's full rendered text.
              fieldsTruncated:
                type: boolean
                description: >
                  True if this section's `fields` list below was cut short to
                  keep the whole outline under Bedrock's response budget
                  (rare -- only for a doc with an unusually large number of
                  fields). The section's own text (via a `section` call) is
                  never truncated by this.
              fields:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                    size:
                      type: integer
                      description: Length in characters of this field's full rendered text.
                    portalSection:
                      type: string
                      description: >
                        The heading this field is grouped under on the portal's
                        own D4D page, when that differs from this schema
                        section's grouping.
        section:
          type: string
          description: Present in a section response (echoes the requested section id).
        heading:
          type: string
          description: Present in a section response.
        field:
          type: string
          description: Present in a field response (echoes the resolved field id).
        label:
          type: string
          description: Present in a field response.
        schemaSection:
          type: string
          description: Present in a field response -- the field's D4D schema section id.
        portalSection:
          type: string
          description: Present in a field response, when known -- see `sections[].fields[].portalSection` above.
        inSchema:
          type: boolean
          description: >
            Present in a field response -- whether this field is a modeled
            slot in the pinned D4D schema, as opposed to extra data the
            source YAML carries outside it.
        text:
          type: string
          description: >
            Present in a section or field response. Readable text for this
            page, up to ~15,000 characters.
        totalLength:
          type: integer
          description: Present in a section response. The section's full length in characters.
        nextOffset:
          type: integer
          description: >
            Present in a section or field response only when the text was
            truncated; pass back as `offset` to get the next page.
        error:
          type: string
      additionalProperties: false
    CompareD4DRequest:
      type: object
      required:
        - field
      properties:
        field:
          type: string
          description: >
            A field id or label, e.g. "distribution_formats" or
            "Distribution Formats" (matching is case- and
            spacing-insensitive).
      additionalProperties: false
    CompareD4DResponse:
      type: object
      properties:
        field:
          type: string
        label:
          type: string
        description:
          type: string
        schemaSection:
          type: string
        portalSection:
          type: string
        orgs:
          type: array
          items:
            type: object
            properties:
              orgId:
                type: string
              name:
                type: string
                description: >
                  The Grand Challenge org's display name. Best-effort: the live
                  organizations-table name, falling back to a bundled label
                  if that lookup fails -- never fails the call.
              present:
                type: boolean
                description: Whether this org's D4D has a value for the field.
              text:
                type: string
                description: This org's rendered text for the field (empty when `present` is false).
              truncated:
                type: boolean
                description: >
                  True if `text` was capped to keep the whole response under
                  the shared per-response character budget.
        error:
          type: string
      additionalProperties: false
    SearchD4DRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: Case-insensitive keyword or phrase to search for.
        orgId:
          type: string
          description: >
            Optional Grand Challenge org id to scope the search to one D4D
            (omit to search across all of them).
      additionalProperties: false
    SearchD4DResponse:
      type: object
      properties:
        query:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              orgId:
                type: string
              section:
                type: string
                description: The section id the matching field belongs to.
              heading:
                type: string
                description: That section's heading.
              field:
                type: string
                description: The matching field's id.
              label:
                type: string
                description: The matching field's label.
              snippet:
                type: string
                description: Up to ~300 characters of context around the match.
        orgHits:
          type: array
          description: >
            Present only when `orgId` was omitted (searching all 4 GCs).
            One entry per Grand Challenge, including ones with no matches at
            all, so a caller can tell "this GC has none" apart from "this GC
            had matches that got capped" -- check this (and `truncated`)
            before concluding a GC doesn't cover something, and rerun with
            `orgId` to see the rest of a capped GC's matches. The cap is
            allocated round-robin by rank across GCs (one hit from each GC
            with one at that rank, in turn), not first-come-first-served, so
            a GC with many matches can no longer starve the ones after it.
          items:
            type: object
            properties:
              orgId:
                type: string
              matches:
                type: integer
                description: Total fields matching the query for this GC, before capping.
              returned:
                type: integer
                description: How many of this GC's matches made it into `results`.
        truncated:
          type: boolean
          description: >
            True if any match (in any GC searched) didn't make it into
            `results` because of the D4D_MAX_SNIPPETS cap.
        error:
          type: string
      additionalProperties: false

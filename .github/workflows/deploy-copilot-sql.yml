name: Deploy Copilot stack (SQL)

on:
  workflow_dispatch:  # manually trigger dev or prod deploys from any branch
    inputs:
      environment:
        description: Target environment
        type: choice
        default: dev
        options:
          - dev
          - prod
  # The push-to-main (prod) trigger is intentionally disabled for now: this
  # stack's S3_BUCKET/LambdaS3Bucket and the cloudformation template's
  # KnowledgeBaseId are still REPLACE_ME placeholders (see the "Guard"
  # step below and agents/b2ai-copilot/cloudformation.sql.yaml), so a merge
  # to main would trigger this workflow and immediately fail red on every
  # PR that touches the copilot -- there's no bucket/KB to deploy to yet.
  # Re-enable it once those placeholders are filled in with real values:
  #
  # push:
  #   branches: [main]
  #   paths:
  #     - agents/b2ai-copilot/cloudformation.sql.yaml
  #     - agents/b2ai-copilot/lambda/b2aiSqlRag/**

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TEMPLATE: agents/b2ai-copilot/cloudformation.sql.yaml
      LAMBDA_DIR: agents/b2ai-copilot/lambda/b2aiSqlRag
      # Not yet provisioned for the B2AI stacks -- replace with a real bucket
      # name (and update LambdaS3Bucket accordingly) before this workflow can
      # actually deploy. The "Guard placeholders" step below fails fast
      # while this is still unset.
      S3_BUCKET: REPLACE_ME_B2AI_S3_BUCKET
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard placeholders
        run: |
          if [ "${S3_BUCKET#REPLACE_ME}" != "$S3_BUCKET" ]; then
            echo "::error::S3_BUCKET is still a REPLACE_ME placeholder ($S3_BUCKET)." \
                 "Set a real bucket name in this workflow (and the matching" \
                 "LambdaS3Bucket default in cloudformation.sql.yaml) before deploying."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set environment
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "STACK_NAME=b2ai-copilot-sql-prod" >> "$GITHUB_ENV"
            echo "AGENT_NAME=b2ai-copilot-sql" >> "$GITHUB_ENV"
            echo "LAMBDA_FN=b2ai-copilot-sql-sqlrag" >> "$GITHUB_ENV"
            echo "S3_KEY=lambda/b2aiSqlRag.zip" >> "$GITHUB_ENV"
          else
            echo "STACK_NAME=b2ai-copilot-sql-dev" >> "$GITHUB_ENV"
            echo "AGENT_NAME=b2ai-copilot-sql-dev" >> "$GITHUB_ENV"
            echo "LAMBDA_FN=b2ai-copilot-sql-dev-sqlrag" >> "$GITHUB_ENV"
            echo "S3_KEY=lambda/b2aiSqlRag-dev.zip" >> "$GITHUB_ENV"
          fi

      - name: Detect what changed
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          if echo "$CHANGED" | grep -q "$LAMBDA_DIR/lambda_function.py"; then
            echo "lambda=true" >> "$GITHUB_OUTPUT"
          else
            echo "lambda=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep "agents/b2ai-copilot/" | grep -qv "$LAMBDA_DIR/lambda_function.py"; then
            echo "stack=true" >> "$GITHUB_OUTPUT"
          else
            echo "stack=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Lambda code
        if: steps.changes.outputs.lambda == 'true'
        run: |
          cd "$LAMBDA_DIR"
          zip /tmp/b2aiSqlRag.zip lambda_function.py
          aws s3 cp /tmp/b2aiSqlRag.zip "s3://${S3_BUCKET}/${S3_KEY}"
          aws lambda update-function-code \
            --function-name "$LAMBDA_FN" \
            --s3-bucket "$S3_BUCKET" \
            --s3-key "$S3_KEY"

      - name: Deploy stack
        if: steps.changes.outputs.stack == 'true'
        run: |
          aws cloudformation deploy \
            --template-file "$TEMPLATE" \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
                AgentName="$AGENT_NAME" \
                FoundationModelId="anthropic.claude-haiku-4-5-20251001-v1:0" \
                SynapseAuthToken="${{ secrets.SYNAPSE_AUTH_TOKEN }}" \
                LambdaS3Bucket="$S3_BUCKET" \
                LambdaS3Key="$S3_KEY" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

# baseURL tracks the current git remote (github.com/Bankso/b2ai-se-chatbot,
# served at bankso.github.io/b2ai-se-chatbot/ via GitHub Pages). If this repo
# is ever transferred/renamed, or the docs site is forked again, update this
# to match the new remote/Pages URL.
baseURL = 'https://bankso.github.io/b2ai-se-chatbot/'
title = 'Bridge2AI Standards Explorer Copilot Docs'
theme = 'hugo-book'

disablePathToLower = true

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 1

[params]
  BookTheme = 'light'
  BookSection = 'docs'
  BookFavicon = 'favicon.svg'
  BookRepo = 'https://github.com/Bankso/b2ai-se-chatbot'
  BookSearch = true
  BookComments = false
  BookPortableLinks = 'warning'

[[menu.after]]
  name = 'GitHub'
  url = 'https://github.com/Bankso/b2ai-se-chatbot'
  weight = 10
